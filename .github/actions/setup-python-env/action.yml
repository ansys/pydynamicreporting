name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.14.10"
  uv-version:
    description: "uv version to use"
    required: false
    default: "0.13.5"
  sync-project:
    description: "Install the frozen project environment"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Env
      uses: ./.github/actions/setup-env

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-suffix: ${{ inputs.python-version }}

    - name: Install patched Python
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/pydr-python
      run: |
        metadata_path="$GITHUB_WORKSPACE/.github/python-downloads.json"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          metadata_url="file:///$(cygpath -am "$metadata_path")"
        else
          metadata_url="file://$metadata_path"
        fi
        uv python install "$PYTHON_VERSION" --no-bin --no-registry \
          --python-downloads-json-url "$metadata_url"
        python_executable="$(uv python find --managed-python "$PYTHON_VERSION")"
        python_command="$python_executable"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python_command="$(cygpath -u "$python_executable")"
        fi
        "$python_command" scripts/check_ci_python.py
        "$python_command" -c "import os, sys; print(os.path.dirname(sys.executable))" >> "$GITHUB_PATH"
        echo "UV_PYTHON=$python_executable" >> "$GITHUB_ENV"
        echo "UV_PYTHON_INSTALL_DIR=$UV_PYTHON_INSTALL_DIR" >> "$GITHUB_ENV"

    - name: Get exact Python version
      id: resolved-python
      shell: bash
      run: |
        PYTHON_VERSION=$(python -c "import sys; print('{}.{}.{}'.format(*sys.version_info[:3]))")
        echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache .venv directory
      if: inputs.sync-project == 'true'
      uses: actions/cache@v4
      with:
        path: .venv
        key: uv-venv-${{ runner.os }}-${{ steps.resolved-python.outputs.version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          uv-venv-${{ runner.os }}-${{ steps.resolved-python.outputs.version }}-

    - name: Install Python dependencies
      if: inputs.sync-project == 'true'
      run: make install
      shell: bash

    - name: Add .venv to PATH (cross-platform)
      if: inputs.sync-project == 'true'
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$(pwd)/.venv/Scripts" >> $GITHUB_PATH
        else
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
        fi
      shell: bash
