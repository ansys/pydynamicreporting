name: Tests

on:
  # Reusable from other workflows
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
    secrets:
      LICENSE_SERVER:
        required: true
      PYANSYS_CI_BOT_TOKEN:
        required: true
      ADR_GHCR_USERNAME:
        required: true
      ADR_GHCR_TOKEN:
        required: true
  # Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA)"
        required: false
        default: ""

jobs:
  test:
    name: Testing (py ${{ matrix.python-version }})
    runs-on: public-ubuntu-latest-16-cores
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: '0'
          fetch-tags: true
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          # The ADR image lives in the EMU enterprise, which this repository's GITHUB_TOKEN
          # cannot read, so log in with an EMU account token that has read:packages.
          username: ${{ secrets.ADR_GHCR_USERNAME }}
          password: ${{ secrets.ADR_GHCR_TOKEN }}

      - name: Diagnose GHCR authorization (temporary)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ADR_GHCR_TOKEN }}
          ADR_GHCR_USERNAME: ${{ secrets.ADR_GHCR_USERNAME }}
        run: |
          set +x
          status=0
          echo "Docker credential comparisons (values are not printed)"
          jq '
            .auths["ghcr.io"].auth as $auth
            | if $auth then
                ($auth | @base64d | split(":")) as $credentials
                | {
                    username_matches: ($credentials[0] == env.ADR_GHCR_USERNAME),
                    token_matches: ($credentials[1] == env.GH_TOKEN)
                  }
              else
                {inline_credentials_present: false}
              end
          ' "${DOCKER_CONFIG:-$HOME/.docker}/config.json" || status=1
          echo "GitHub token identity"
          gh api --hostname github.com user \
            --jq '{login: .login, expected_emu_account: (.login == "vrajendr_snps")}' || status=1
          echo "GitHub API status and token scopes"
          gh api --hostname github.com --include user --jq empty |
            grep -Ei '^(HTTP/|X-OAuth-Scopes:)' || status=1
          echo "GitHub package metadata authorization"
          gh api --hostname github.com orgs/snps-ansys-internal/packages/container/adr_dev \
            --jq '{name: .name, visibility: .visibility, message: .message}' || status=1
          echo "Docker manifest authorization"
          docker manifest inspect ghcr.io/snps-ansys-internal/adr_dev:latest >/dev/null || status=1
          exit "$status"

      - name: Pull Docker container
        run: make pull-docker

      - name: Set licensing if necessary
        shell: bash
        run: |
          echo "ANSYS_DPF_ACCEPT_LA=Y" >> $GITHUB_ENV
          echo "ANSYSLMD_LICENSE_FILE=1055@${{ secrets.LICENSE_SERVER }}" >> $GITHUB_ENV

      - name: Update packages
        shell: bash
        run: |
          sudo apt update && sudo apt install -y \
            libx11-dev \
            libgl1-mesa-dev \
            libxrender1

      # TODO: Restore DPF tests once PYANSYS_CI_BOT_TOKEN is SAML-authorized.
      - name: Install DPF
        id: set-server-path
        if: false
        uses: ansys/pydpf-actions/install-dpf-server@v2.3
        with:
          dpf-standalone-TOKEN: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          standalone_suffix: ${{ env.DPF_STANDALONE_SUFFIX }}
          ANSYS_VERSION: ${{ env.ANSYS_VERSION }}

      - name: Run pytest without DPF tests
        run: make test
        env:
          ANSYSLMD_LICENSE_FILE: ${{ format('1055@{0}', secrets.LICENSE_SERVER) }}
          PYTEST_ADDOPTS: --ignore=tests/test_enhanced_images.py

      - name: Run pytest
        if: false
        run: make test
        env:
          ANSYSLMD_LICENSE_FILE: ${{ format('1055@{0}', secrets.LICENSE_SERVER) }}

      - name: Upload coverage report
        if: matrix.python-version == env.MAIN_PYTHON_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 60
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.MAIN_PYTHON_VERSION
        uses: codecov/codecov-action@v6
