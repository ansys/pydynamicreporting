name: Create Draft Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write         # REQUIRED for OIDC
      attestations: write     # REQUIRED by attest-build-provenance v2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: '0'
          fetch-tags: true

      - name: Set up Env
        uses: ./.github/actions/setup-env

      - name: Validate the release tag
        id: release-tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_tools.py validate-tag "$RELEASE_TAG" \
            --require-existing \
            --require-head \
            --ref-type "$RELEASE_REF_TYPE"

      - name: Run version checks
        run: make check-version

      - name: Inspect any existing release
        id: existing-release
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            if [[ "$(gh release view "${{ github.ref_name }}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "Release for tag '${{ github.ref_name }}' is already published."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build library source and wheel artifacts
        uses: ./.github/actions/build-library
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          checkout: false

      - name: Create or repair the draft GitHub Release
        run: |
          release_flags=(--draft)
          if [[ "${{ steps.release-tag.outputs.prerelease }}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          if [[ "${{ steps.existing-release.outputs.exists }}" != "true" ]]; then
            gh release create "${{ github.ref_name }}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --notes "See [CHANGELOG.md](./CHANGELOG.md)" \
              "${release_flags[@]}"
          else
            echo "Reusing the existing draft for ${GITHUB_REF_NAME}."
          fi
          gh release upload "${{ github.ref_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
