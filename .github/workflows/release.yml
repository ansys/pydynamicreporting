name: Release

on:
  workflow_dispatch:
    inputs:
      deploy_stable_docs:
        description: "Deploy documentation as the stable site"
        required: false
        type: boolean
        default: false
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare reviewed release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Validate the exact release tag
        id: release-tag
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_tools.py validate-tag "$RELEASE_TAG" \
            --require-existing \
            --require-head \
            --expected-prerelease "$RELEASE_PRERELEASE" \
            --ref-type "$RELEASE_REF_TYPE"

      - name: Set up Env
        uses: ./.github/actions/setup-env

      - name: Download the reviewed GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir reviewed-dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir reviewed-dist

      - name: Preserve reviewed assets for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}-artifacts
          path: reviewed-dist/
          if-no-files-found: error
          retention-days: 7

  upload-release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [ prepare-release ]
    permissions:
      id-token: write         # REQUIRED for OIDC
      attestations: write     # REQUIRED by attest-build-provenance v2
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Set up Env
        uses: ./.github/actions/setup-env

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PACKAGE_NAME }}-artifacts
          path: ${{ env.PACKAGE_NAME }}-artifacts

      - name: Validate artifact names and versions
        env:
          ARTIFACT_DIRECTORY: ${{ env.PACKAGE_NAME }}-artifacts
          EXPECTED_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_tools.py validate-artifacts \
            "$RELEASE_TAG" \
            "$ARTIFACT_DIRECTORY" \
            "$EXPECTED_PACKAGE_NAME"

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@v1.14.0
        if: ${{ !env.ACT }}
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

  # Publish versioned docs after PyPI succeeds. The Ansys deployment action keeps
  # prereleases separate and updates stable only from final-release versions.
  docs:
    name: Docs (post-release)
    needs: [ upload-release ]
    permissions:
      contents: write
    uses: ./.github/workflows/release-docs.yml
    with:
      deploy_stable: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy_stable_docs) }}
    secrets: inherit

  notify-release-failure:
    name: Teams notify on failure
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs: [ prepare-release, upload-release, docs ]
    runs-on: ubuntu-latest
    steps:
      - name: Microsoft Teams Notification
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.MS_TEAMS_WEBHOOK_URI_CI }}
          notification-summary: "❌ Release workflow failed in `${{ github.workflow }}` on `${{ github.ref_name }}`"
          notification-color: dc3545
          timezone: America/New_York
