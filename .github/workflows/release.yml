name: Release

on:
  workflow_dispatch:
    inputs:
      deploy_stable_docs:
        description: "Deploy documentation as the stable site"
        required: false
        type: boolean
        default: false
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      id-token: write         # REQUIRED for OIDC (provenance)
      attestations: write     # REQUIRED by attest-build-provenance v2
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Validate the exact release tag
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF_TYPE" != "tag" ]]; then
            echo "Release publication must run from an existing Git tag."
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG."
            exit 1
          fi

      - name: Set up Python Env
        uses: ./.github/actions/setup-python-env

      - name: Run version checks
        run: make check-version

      - name: Build library source and wheel artifacts
        uses: ./.github/actions/build-library
        with:
          library-name: ${{ env.PACKAGE_NAME }}
          python-version: ${{ env.MAIN_PYTHON_VERSION }}
          checkout: false

  upload-release:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [ build-release ]
    permissions:
      id-token: write         # REQUIRED for OIDC
      attestations: write     # REQUIRED by attest-build-provenance v2
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Set up Env
        uses: ./.github/actions/setup-env

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.PACKAGE_NAME }}-artifacts
          path: ${{ env.PACKAGE_NAME }}-artifacts

      - name: Validate artifact names and versions
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ env.PACKAGE_NAME }}-artifacts
          EXPECTED_PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import email.parser
          import os
          from pathlib import Path
          import re
          import tarfile
          import zipfile

          artifact_directory = Path(os.environ["ARTIFACT_DIRECTORY"])
          expected_name = re.sub(r"[-_.]+", "-", os.environ["EXPECTED_PACKAGE_NAME"]).lower()
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(artifact_directory.glob("*.whl"))
          sdists = list(artifact_directory.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist; found {len(wheels)} wheel(s) "
                  f"and {len(sdists)} sdist(s)."
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_files = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_files) != 1:
                  raise SystemExit("Wheel must contain exactly one METADATA file.")
              wheel_metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_files[0]))

          with tarfile.open(sdists[0], "r:gz") as archive:
              pkg_info_files = [member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")]
              if len(pkg_info_files) != 1:
                  raise SystemExit("Source distribution must contain exactly one PKG-INFO file.")
              extracted = archive.extractfile(pkg_info_files[0])
              if extracted is None:
                  raise SystemExit("Unable to read source distribution PKG-INFO.")
              sdist_metadata = email.parser.BytesParser().parsebytes(extracted.read())

          for artifact, metadata in ((wheels[0], wheel_metadata), (sdists[0], sdist_metadata)):
              actual_name = re.sub(r"[-_.]+", "-", metadata["Name"]).lower()
              actual_version = metadata["Version"]
              if actual_name != expected_name or actual_version != expected_version:
                  raise SystemExit(
                      f"{artifact.name} contains {metadata['Name']} {actual_version}; "
                      f"expected {os.environ['EXPECTED_PACKAGE_NAME']} {expected_version}."
                  )
              print(f"Validated {artifact.name}: {metadata['Name']} {actual_version}")
          PY

      - name: "Upload artifacts to PyPI using trusted publisher"
        uses: pypa/gh-action-pypi-publish@v1.14.0
        if: ${{ !env.ACT }}
        with:
          repository-url: "https://upload.pypi.org/legacy/"
          print-hash: true
          packages-dir: ${{ env.PACKAGE_NAME }}-artifacts
          skip-existing: false

  # Publish versioned docs after PyPI succeeds. The Ansys deployment action keeps
  # prereleases separate and updates stable only from final-release versions.
  docs:
    name: Docs (post-release)
    needs: [ upload-release ]
    permissions:
      contents: write
    uses: ./.github/workflows/release-docs.yml
    with:
      deploy_stable: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy_stable_docs) }}
    secrets: inherit

  notify-release-failure:
    name: Teams notify on failure
    if: failure()
    needs: [ build-release, upload-release ]
    runs-on: ubuntu-latest
    steps:
      - name: Microsoft Teams Notification
        uses: jdcargile/ms-teams-notification@v1.4
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.MS_TEAMS_WEBHOOK_URI_CI }}
          notification-summary: "❌ Release workflow failed in `${{ github.workflow }}` on `${{ github.ref_name }}`"
          notification-color: dc3545
          timezone: America/New_York
